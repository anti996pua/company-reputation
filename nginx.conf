# company-reputation Nginx 配置
# 启用 gzip、缓存策略、404 页面、安全头
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/html
        text/css
        text/plain
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── 404 页面 ──
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ── 静态资源强缓存（hash 文件名场景暂不适用，用 max-age） ──
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff";
    }

    # ── 图片缓存（SVG/PNG/JPG/ICO） ──
    location ~* \.(svg|png|jpg|jpeg|ico|gif|webp)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff";
        expires 1d;
    }

    # ── data.js（搜索索引，可能频繁更新，短缓存） ──
    location = /js/data.js {
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff";
    }

    # ── HTML 页面协商缓存 ──
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── 首页 ──
    location = / {
        try_files /index.html =404;
    }

    # ── 安全头 ──
    add_header X-Frame-Options "DENY";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # ── 禁止访问隐藏文件 ──
    location ~ /\. {
        deny all;
    }
}
